# Local development database only. Never use these credentials anywhere else.
name: portfolyo-test

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports:
      # 5433 on the host: 5432 is commonly taken by other local Postgres containers.
      - "127.0.0.1:5433:5432"
    volumes:
      - portfolio-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  portfolio-db:
